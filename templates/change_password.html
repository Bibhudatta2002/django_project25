{% extends 'dummy.html' %}

{% block title %}
    change_password
{% endblock %}

{% block body_block %}

<style>
    .home {
        text-align: center;
        margin: 70px auto;
        padding: 35px 20px;
        max-width: 600px;
        background: #3898ec;
        border-radius: 12px;
        box-shadow: 0 4px 12px #ddd;
    }

    .home h1 {
        color: #007bff;
    }

    .home p {
        color: #555;
        font-size: 17px;
    }

    .home a {
        display: inline-block;
        margin: 8px;
        padding: 10px 20px;
        color: white;
        background: #007bff;
        text-decoration: none;
        border-radius: 5px;
        transition: 0.3s;
    }

    .home a:hover {
        background: #0056b3;
        transform: scale(1.05);
    }
</style>

<div>
    <center>
            <h1>change_password</h1>
    <form method="POST">
        {% csrf_token %}
        <label for="npw">New password</label>
        <input type="password" name="npw" id="npw">
        <br><br>
        <input type="submit" value="change_password">
    </form>

   
    </center>


</div>

{% endblock %}
