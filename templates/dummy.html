<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    {% block title %}
    <title>Bootstrap Demopage</title>
    {% endblock %}

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <a href="{% url 'registration' %}"
           class="nav-link bg-success text-white p-2">
            Registration
        </a>

        <a href="{% url 'home' %}"
           class="nav-link bg-info text-dark p-2">
            Home
        </a>



        {% if user.is_authenticated %}

            <a href="{% url 'user_logout' %}"
               class="nav-link bg-danger text-white p-2">
                User Logout
            </a>

            <a href="{% url 'display_user_data' %}"
               class="nav-link bg-warning text-dark p-2">
                Display User Data
            </a>

             <a href="{% url 'change_password' %}"
               class="nav-link bg-light text-dark p-2">
               change password
            </a>

        {% else %}

            <a href="{% url 'user_login' %}"
               class="nav-link bg-primary text-white p-2">
                User Login
            </a>

        {% endif %}
       <a href="{% url 'reset_password' %}"
               class="nav-link bg-secondary text-dark p-2">
               reset password 
            </a>


    

    </nav>

    {% block body_block %}
    {% endblock %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
