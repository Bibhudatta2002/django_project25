{% extends 'dummy.html' %}

{% block title %}User Login{% endblock %}

{% block body_block %}

<style>
    .login-container {
        max-width: 400px;
        margin: 60px auto;
        padding: 30px;
        background: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .login-container h1 {
        text-align: center;
        color: #333333;
        margin-bottom: 25px;
    }

    .login-container label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 18px;
        border: 1px solid #cccccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    .login-container input[type="text"]:focus,
    .login-container input[type="password"]:focus {
        outline: none;
        border-color: #007bff;
    }

    .login-container input[type="submit"] {
        width: 100%;
        padding: 11px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .login-container input[type="submit"]:hover {
        background: #0056b3;
    }
</style>

<div class="login-container">

    <h1>User Login</h1>

    <form action="" method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
            type="text"
            name="username"
            id="username"
            placeholder="Enter username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <input type="submit" value="Login">

    </form>

</div>

{% endblock %}
